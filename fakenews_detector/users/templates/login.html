{% extends "base.html" %}

<!-- Change the page title block -->
{% block title %}Log In to Your Account{% endblock %}

<!-- Fill the main content block -->
{% block content %}
<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md p-8 bg-gray-800 shadow-lg rounded-lg">
        
        <!-- This is for our error/success messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="p-4 mb-4 text-sm rounded-lg
                    {% if message.tags == 'success' %} bg-green-900 text-green-300 {% endif %}
                    {% if message.tags == 'error' %} bg-red-900 text-red-300 {% endif %}
                " role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <h2 class="mt-6 text-center text-2xl font-bold leading-9 tracking-tight text-white">
            Sign in to your account
        </h2>

        <form class="space-y-6 mt-6" method="POST">
            {% csrf_token %}
            
            <!-- This applies styling to the form fields generated by Django -->
            <div class="text-gray-200 [&_p]:mb-4 [&_input]:w-full [&_input]:rounded-md [&_input]:border-0 [&_input]:py-1.5 [&_input]:text-gray-900 [&_input]:shadow-sm [&_input]:ring-1 [&_input]:ring-inset [&_input]:ring-gray-300 [&_input]:placeholder:text-gray-400 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_label]:leading-6 [&_label]:text-white [&_label]:mb-2">
                {{ form.as_p }}
            </div>

            <div>
                <button type="submit" class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                    Sign in
                </button>
            </div>
        </form>

        <p class="mt-10 text-center text-sm text-gray-400">
            Don't have an account?
            <a href="{% url 'register' %}" class="font-semibold leading-6 text-indigo-400 hover:text-indigo-300">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
